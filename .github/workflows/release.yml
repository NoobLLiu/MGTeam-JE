name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Build plugin
        run: bash ci/build.sh
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          body_path: ci/RELEASE_NOTES.md
          files: build/MGTeam-1.0.0.jar
